name: Skill CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skill-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python }} tests and package checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run helper and package tests
        run: python -m unittest discover -s tests -v
      - name: Check patch whitespace
        run: git show --format= --check HEAD

  installation:
    name: Codex and Claude Code install (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        mode: [symlink, copy]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install into a temporary project and verify both agents
        env:
          DISABLE_TELEMETRY: '1'
          INSTALL_MODE: ${{ matrix.mode }}
        shell: bash
        run: |
          set -euo pipefail
          install_project="$(mktemp -d "$RUNNER_TEMP/brand-content-install.XXXXXX")"
          cd "$install_project"
          install_flags=()
          if [[ "$INSTALL_MODE" == "copy" ]]; then
            install_flags+=(--copy)
          fi
          npx --yes skills@1.5.25 add "$GITHUB_WORKSPACE" --skill brand-content --agent codex claude-code --yes "${install_flags[@]}"
          python3 "$GITHUB_WORKSPACE/tests/verify_installation.py" "$GITHUB_WORKSPACE/skills/brand-content" "$install_project" --mode "$INSTALL_MODE"
